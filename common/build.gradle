plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'de.michelinside.glucodatahandler.common'
    compileSdk rootProject.compileSdk

    defaultConfig {
        minSdk rootProject.minSdk
        targetSdk rootProject.targetSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        buildConfigField("String", "DEXCOM_APPLICATION_ID", rootProject.DEXCOM_APPLICATION_ID)
        buildConfigField("String", "DEXCOM_APPLICATION_ID_APAC", rootProject.DEXCOM_APPLICATION_ID_APAC)
        buildConfigField("String", "NIGHTSCOUT_DEBUG_SERVER", rootProject.NIGHTSCOUT_DEBUG_SERVER)
        buildConfigField("int", "BASE_VERSION", rootProject.versionCode.toString())
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        second {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        dev_release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.android.gms:play-services-wearable:19.0.0' // do not use 20.0.1!!!
    implementation 'androidx.work:work-runtime:2.12.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'androidx.window:window:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'io.mockk:mockk:1.14.11'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:6.4.0'
    testImplementation "org.json:json:20260814"
    implementation 'com.google.code.gson:gson:2.14.0'
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    //Room
    def roomVersion = "2.8.5"
    implementation("androidx.room:room-runtime:$roomVersion")
    implementation("androidx.room:room-ktx:$roomVersion")
    ksp("androidx.room:room-compiler:$roomVersion")
}