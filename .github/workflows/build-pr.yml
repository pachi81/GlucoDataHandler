name: Build & Test PR

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ "*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle & Cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          # Allow saving cache on PR and feature branches so subsequent pushes are fast
          cache-read-only: false

      - name: Setup local.properties
        run: |
          cat << 'EOF' > local.properties
          releasePath=build/release
          DEXCOM_APPLICATION_ID=""
          DEXCOM_APPLICATION_ID_APAC=""
          NIGHTSCOUT_DEBUG_SERVER=""
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APKs and Run Unit Tests
        run: ./gradlew assembleDebug test --build-cache
